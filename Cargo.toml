[package]
name = "todo"
version = "1.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json", "form"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
