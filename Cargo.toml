[package]
name = "todo"
version = "1.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json", "form"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.4"
uuid = { version = "1.29.3", features = ["v4"] }
url = "2.5.9"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-rustls", "sqlite"] }
jiff = { version = "1.0.2", features = ["tzdb-bundle-always"] }
