services:
  todo:
    build: .
    image: todo:local
    container_name: todo
    restart: unless-stopped
    init: true
    environment:
      APP_PORT: ${APP_PORT:-3080}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL manquant}
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST manquant}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?OIDC_ISSUER_URL manquant}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID manquant}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET manquant}
      DATABASE_URL: sqlite:///data/todo.db
      RUST_LOG: ${RUST_LOG:-todo=info}
    volumes:
      - todo_data:/data
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.todo.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.todo.entrypoints=websecure"
      - "traefik.http.routers.todo.tls=true"
      - "traefik.http.routers.todo.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.todo.service=todo"
      - "traefik.http.services.todo.loadbalancer.server.port=${APP_PORT:-3080}"
      - "traefik.http.middlewares.todo-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.todo-headers.headers.contentTypeNosniff=true"
      - "traefik.http.routers.todo.middlewares=todo-headers"

volumes:
  todo_data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
