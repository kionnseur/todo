services:
  todo-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo:test
    container_name: todo-test
    env_file:
      - .env
    environment:
      # Le conteneur écoute sur APP_PORT ; le port hôte est configurable.
      APP_ENV: test
      APP_PORT: 3080
      PUBLIC_URL: http://localhost:${HOST_PORT:-3080}
      OIDC_ISSUER_URL: http://oidc.localhost:8090/default
      OIDC_CLIENT_ID: todo-test
      OIDC_CLIENT_SECRET: todo-test-secret
      DATABASE_URL: sqlite:///data/todo.db
    ports:
      - "${HOST_PORT:-3080}:3080"
    depends_on:
      mock-oidc:
        condition: service_healthy
    volumes:
      - todo_test_data:/data
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.1
    container_name: todo-test-oidc
    hostname: oidc.localhost
    environment:
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/isalive >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
    networks:
      default:
        aliases:
          - oidc.localhost

volumes:
  todo_test_data:
